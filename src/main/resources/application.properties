# ?????????????????????????????????????????
# BIDIWS ? Configuration principale
# ?????????????????????????????????????????

# Name
spring.application.name=bidiws-backend

# Serveur
server.port=8080

# ?????????????????????????????????????????
# BASE DE DONNÉES PostgreSQL
# ?????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/bidiws_db
spring.datasource.username=bidiws_user
spring.datasource.password=bidiws_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ?????????????????????????????????????????
# FLYWAY ? Migrations SQL
# ?????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ?????????????????????????????????????????
# JWT
# ?????????????????????????????????????????
bidiws.jwt.secret=bidiws_super_secret_key_change_in_production_min_256_bits
bidiws.jwt.expiration=86400000
# 86400000ms = 24h

# ?????????????????????????????????????????
# WEBSOCKET
# ?????????????????????????????????????????
bidiws.websocket.allowed-origins=http://localhost:5173

# ?????????????????????????????????????????
# UPLOAD FICHIERS (photos signalements)
# ?????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
bidiws.upload.dir=uploads/

# ?????????????????????????????????????????
# LOGS
# ?????????????????????????????????????????
logging.level.com.bidiws=DEBUG
logging.level.org.springframework.security=INFO