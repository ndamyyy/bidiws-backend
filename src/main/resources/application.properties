# Application
spring.application.name=bidiws-backend

# Serveur
server.port=8081
server.servlet.context-path=/bidiws

# Base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/bidiws_db
spring.datasource.username=bidiws_user
spring.datasource.password=bidiws_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway - Migrations SQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
bidiws.jwt.secret=G9KxtppuDnEavgTIxJ0GdF+h8K5lzuoBMgRCyt4nu+w=
bidiws.jwt.expiration=86400000

# WebSocket
bidiws.websocket.allowed-origins=http://localhost:5173

# Upload fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
bidiws.upload.dir=uploads/

# Logs
logging.level.com.bidiws=DEBUG
logging.level.org.springframework.security=INFO